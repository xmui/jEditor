[package]
name = "jeditor-app"
version = "0.0.0"
edition = "2021"
publish = false
description = "jEditor for Mac (and later Linux) on Tauri: the system's own web view, with the Rust core (../core)"

[[bin]]
name = "jeditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jeditor-core = { path = "../core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde_json = "1"
ureq = "2"
http = "1"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
