name: Release

# Publishes a GitHub Release with the Windows setup, the portable zip, the
# Mac app (.dmg, built and smoke-tested on a Mac first) and standalone.html
# (the web app as one file) attached.
# Runs by itself when a version bump (npm run bump x.y.z: app/version.js and
# package.json) lands on main, and can be run by hand from the Actions tab.
#
# Tag: v<version>, e.g. v1.18.1. Run by hand for a version that's already
# released (say, a fix to the Windows side alone), it makes v1.18.1-2, then
# -3, and so on.
on:
  push:
    branches: [main]
    paths:
      - app/version.js
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: mac
      - name: Native toolbar
        run: npm ci && node build.js
        working-directory: mac/native
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: node scripts/smoke-test-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-mac
          path: dist/jEditor-*-mac.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: mac
      # bsdtar, for the Arch package
      - run: sudo apt-get install -y libarchive-tools
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: xvfb-run -a node scripts/smoke-test-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-linux
          path: |
            dist/jEditor-*-linux.AppImage
            dist/jEditor-*-linux.deb
            dist/jEditor-*-linux.pacman
          if-no-files-found: error

  release:
    needs: [mac, linux]
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Pick the tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content app/version.js -Raw), "APP_VERSION = '([0-9.]+)'").Groups[1].Value
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq '.[].tagName')
          $auto = '${{ github.event_name }}' -eq 'push'
          $tag = "v$version"
          if ($tags -contains $tag) {
            if ($auto) { Write-Host "$tag is already released; nothing to do"; "skip=true" >> $env:GITHUB_OUTPUT; exit 0 }
            $n = 2
            while ($tags -contains "v$version-$n") { $n++ }
            $tag = "v$version-$n"
          }
          Write-Host "Releasing $tag"
          "skip=false" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: ./scripts/build.ps1 -Tag ${{ steps.tag.outputs.tag }}
      - name: Smoke test
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Standalone page
        if: steps.tag.outputs.skip == 'false'
        run: node scripts/build-standalone.js
      - name: The Mac app
        if: steps.tag.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: jEditor-mac
          path: dist
      - name: The Linux app
        if: steps.tag.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: jEditor-linux
          path: dist

      - name: Release notes
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $notes = node scripts/release-notes.js ${{ steps.tag.outputs.version }}
          if ($LASTEXITCODE -ne 0) { $notes = '' }
          @"
          **Windows:** download **jEditor-Setup-${{ steps.tag.outputs.version }}.exe** and run it: it installs for you only and doesn't need admin rights. The first time, Windows may say it protected your PC: click **More info**, then **Run anyway**. Or unzip **jEditor-${{ steps.tag.outputs.version }}-portable.zip** anywhere and run jEditor.exe.

          **Mac:** download **jEditor-${{ steps.tag.outputs.version }}-mac.dmg**, open it and drag jEditor to Applications. It isn't signed by Apple yet: the first time, macOS won't open it; go to System Settings → Privacy & Security and click **Open Anyway**. It only asks once.

          **Web:** open https://xmui.github.io/jEditor/ in Chrome or Edge, or download **standalone.html** and open it: one file, no install. Scanning, the camera and the sidebar's drives are in the Windows app only.

          ## What's new in jEditor ${{ steps.tag.outputs.version }}

          $($notes -join "`n")
          "@ | Set-Content release-notes.md

      - name: Publish
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "jEditor ${{ steps.tag.outputs.version }}" --notes-file release-notes.md `
            (Get-Item dist/jEditor-Setup-*.exe).FullName (Get-Item dist/jEditor-*-portable.zip).FullName (Get-Item dist/jEditor-*-mac.dmg).FullName (Get-Item dist/jEditor-*-linux.AppImage).FullName (Get-Item dist/jEditor-*-linux.deb).FullName (Get-Item dist/jEditor-*-linux.pacman).FullName (Get-Item standalone.html).FullName

  # Homebrew (Casks/jeditor.rb): the new version and the .dmg's checksum,
  # as GitHub has it for the release, committed to main
  cask:
    needs: release
    if: needs.release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"jEditor-$VERSION-mac.dmg\") | .digest")
          sha=${digest#sha256:}
          if [ ${#sha} -ne 64 ]; then echo "::error::No checksum for jEditor-$VERSION-mac.dmg in $TAG"; exit 1; fi
          sed -i -E "s/^  version \".*\"/  version \"$VERSION,$TAG\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/jeditor.rb
          grep -E '^  (version|sha256) ' Casks/jeditor.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: jEditor $VERSION ($TAG)"
          git push origin HEAD:main
