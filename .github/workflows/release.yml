name: Release

# Publishes a GitHub Release with the Windows setup, the portable zip, the
# Mac app (.dmg, built and smoke-tested on a Mac first), the Linux AppImage,
# .deb and pacman package, and standalone.html (the web app as one file).
# Runs by itself when a version bump (npm run bump x.y.z: app/version.js and
# package.json) lands on main, and can be run by hand from the Actions tab.
#
# Tag: v<version>, e.g. v1.18.1. Run by hand for a version that's already
# released (say, a fix to the Windows side alone), it makes v1.18.1-2, then
# -3, and so on.
#
# Beta: every push to the beta branch publishes a beta, v<version>-beta.N
# (a GitHub prerelease), for the people who turned on Settings → Updates →
# Beta builds. Its version has to be newer than the last release (bump it
# on beta first); Homebrew and the website stay on releases. Betas are
# mostly tried on Windows, so a beta has the Windows app and the web page
# only, unless the last commit pushed says [mac], [linux] or [all], or it's
# run by hand on beta with Mac or Linux ticked. (The Mac and Linux apps look
# for the newest beta with them in it.) Releases always have every app.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      mac:
        description: "A beta: with the Mac app (releases always have it)"
        type: boolean
        default: false
      linux:
        description: "A beta: with the Linux app (releases always have it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What this run releases, if anything: a push to main releases a new
  # version once (nothing to do when it's already out); beta, a new beta
  tag:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      beta: ${{ steps.tag.outputs.beta }}
      title: ${{ steps.tag.outputs.title }}
      mac: ${{ steps.tag.outputs.mac }}
      linux: ${{ steps.tag.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          ASK_MAC: ${{ inputs.mac }}
          ASK_LINUX: ${{ inputs.linux }}
        run: |
          version=$(sed -nE "s/.*APP_VERSION = '([0-9.]+)'.*/\1/p" app/version.js)
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName')
          has() { printf '%s\n' "$tags" | grep -qx "$1"; }
          beta=false
          if [ "$GITHUB_REF_NAME" = beta ]; then
            beta=true
            if has "v$version"; then
              echo "::notice::v$version is already released: bump the version on beta for a new beta"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            n=1
            while has "v$version-beta.$n"; do n=$((n + 1)); done
            tag="v$version-beta.$n"
            title="jEditor $version beta $n"
          else
            tag="v$version"
            if has "$tag"; then
              if [ "$EVENT" = push ]; then echo "$tag is already released; nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              n=2
              while has "v$version-$n"; do n=$((n + 1)); done
              tag="v$version-$n"
            fi
            title="jEditor $version"
          fi
          # Which apps: every one in a release; in a beta, those asked for
          mac=true; linux=true
          if [ "$beta" = true ]; then
            mac=false; linux=false
            asked() { [ "$1" = true ] || printf '%s' "$MESSAGE" | grep -qiE "\[($2|all)\]"; }
            if asked "$ASK_MAC" mac; then mac=true; fi
            if asked "$ASK_LINUX" linux; then linux=true; fi
          fi
          echo "Releasing $tag (Windows$([ $mac = true ] && echo ', Mac')$([ $linux = true ] && echo ', Linux'))"
          { echo "skip=false"; echo "tag=$tag"; echo "version=$version"; echo "beta=$beta"; echo "title=$title"; echo "mac=$mac"; echo "linux=$linux"; } >> "$GITHUB_OUTPUT"

  mac:
    needs: tag
    if: needs.tag.outputs.skip == 'false' && needs.tag.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: mac
      - run: node scripts/set-build.js ${{ needs.tag.outputs.tag }}
      - name: Native toolbar
        run: npm ci && node build.js
        working-directory: mac/native
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: node scripts/smoke-test-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-mac
          path: dist/jEditor-*-mac.dmg
          if-no-files-found: error

  linux:
    needs: tag
    if: needs.tag.outputs.skip == 'false' && needs.tag.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: mac
      - run: node scripts/set-build.js ${{ needs.tag.outputs.tag }}
      # bsdtar, for the Arch package
      - run: sudo apt-get install -y libarchive-tools
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: xvfb-run -a node scripts/smoke-test-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-linux
          path: |
            dist/jEditor-*-linux.AppImage
            dist/jEditor-*-linux.deb
            dist/jEditor-*-linux.pacman
          if-no-files-found: error

  release:
    needs: [tag, mac, linux]
    # (the Mac or Linux app left out of a beta: skipped, not failed)
    if: >-
      ${{ !cancelled() && needs.tag.result == 'success' && needs.tag.outputs.skip == 'false' &&
      needs.mac.result != 'failure' && needs.linux.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: node scripts/set-build.js ${{ needs.tag.outputs.tag }}

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Tag ${{ needs.tag.outputs.tag }}
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Standalone page
        run: node scripts/build-standalone.js
      - name: The Mac app
        if: needs.tag.outputs.mac == 'true'
        uses: actions/download-artifact@v4
        with:
          name: jEditor-mac
          path: dist
      - name: The Linux app
        if: needs.tag.outputs.linux == 'true'
        uses: actions/download-artifact@v4
        with:
          name: jEditor-linux
          path: dist

      - name: Release notes
        shell: pwsh
        run: |
          $notes = node scripts/release-notes.js ${{ needs.tag.outputs.version }}
          if ($LASTEXITCODE -ne 0) { $notes = '' }
          $beta = if ('${{ needs.tag.outputs.beta }}' -eq 'true') { "**This is a beta**, for trying what's coming before it's released. It may have rough edges. In the apps, Settings → Updates → Beta builds keeps you on betas.`n`n" } else { '' }
          # A beta may have only some of the apps (see the top)
          $mac = if ('${{ needs.tag.outputs.mac }}' -eq 'true') { "**Mac:** download **jEditor-${{ needs.tag.outputs.version }}-mac.dmg**, open it and drag jEditor to Applications. It isn't signed by Apple yet: the first time, macOS won't open it; go to System Settings → Privacy & Security and click **Open Anyway**. It only asks once. Or with Homebrew: **brew tap xmui/jeditor https://github.com/xmui/jEditor**, then **brew install --cask xmui/jeditor/jeditor**.`n`n" } else { '' }
          $linux = if ('${{ needs.tag.outputs.linux }}' -eq 'true') { "**Linux** (64-bit): download **jEditor-${{ needs.tag.outputs.version }}-linux.AppImage**, make it executable and open it (it updates itself). Or install **jEditor-${{ needs.tag.outputs.version }}-linux.deb** (**sudo apt install ./jEditor-${{ needs.tag.outputs.version }}-linux.deb**) on Debian, Ubuntu and Mint, or **jEditor-${{ needs.tag.outputs.version }}-linux.pacman** (**sudo pacman -U jEditor-${{ needs.tag.outputs.version }}-linux.pacman**) on Arch.`n`n" } else { '' }
          $beta + @"
          **Windows:** download **jEditor-Setup-${{ needs.tag.outputs.version }}.exe** and run it: it installs for you only and doesn't need admin rights. The first time, Windows may say it protected your PC: click **More info**, then **Run anyway**. Or unzip **jEditor-${{ needs.tag.outputs.version }}-portable.zip** anywhere and run jEditor.exe.

          $mac$linux**Web:** open https://xmui.github.io/jEditor/ in Chrome or Edge, or download **standalone.html** and open it: one file, no install. The sidebar, several windows and updates are in the apps; scanning and the camera are in the Windows app only.

          ## What's new in jEditor ${{ needs.tag.outputs.version }}

          $($notes -join "`n")
          "@ | Set-Content release-notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every app built for it (a beta may leave the Mac or Linux one out)
          $files = @('dist/jEditor-Setup-*.exe', 'dist/jEditor-*-portable.zip', 'dist/jEditor-*-mac.dmg', 'dist/jEditor-*-linux.AppImage', 'dist/jEditor-*-linux.deb', 'dist/jEditor-*-linux.pacman', 'standalone.html') |
            ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | ForEach-Object { $_.FullName }
          gh release create "${{ needs.tag.outputs.tag }}" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "${{ needs.tag.outputs.title }}" --notes-file release-notes.md `
            $(if ('${{ needs.tag.outputs.beta }}' -eq 'true') { '--prerelease' } else { '--latest' }) `
            @files

  # Homebrew (Casks/jeditor.rb): the new version and the .dmg's checksum,
  # as GitHub has it for the release, committed to main
  cask:
    needs: [tag, release]
    if: needs.tag.outputs.beta == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"jEditor-$VERSION-mac.dmg\") | .digest")
          sha=${digest#sha256:}
          if [ ${#sha} -ne 64 ]; then echo "::error::No checksum for jEditor-$VERSION-mac.dmg in $TAG"; exit 1; fi
          sed -i -E "s/^  version \".*\"/  version \"$VERSION,$TAG\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/jeditor.rb
          grep -E '^  (version|sha256) ' Casks/jeditor.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: jEditor $VERSION ($TAG)"
          git push origin HEAD:main
