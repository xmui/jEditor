name: Build

# Every push and pull request: the UI and bridge tests (Linux), then on Windows the
# build, the smoke test (the real app opening a folder and saving a
# rotation), and an install / uninstall test; on a Mac, the Mac app's tests,
# its build and the same smoke test on the built app. The setup, the
# portable zip and the .dmg are kept as artifacts on the run's page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Install test
        shell: pwsh
        run: ./scripts/install-test.ps1 -Setup (Get-Item dist/jEditor-Setup-*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-Setup
          path: dist/jEditor-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-portable
          path: dist/jEditor-*-portable.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: mac
      - name: Native toolbar
        run: npm ci && node build.js
        working-directory: mac/native
      - name: Mac app tests
        run: node test/mac.test.js
        env:
          JEDITOR_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: node scripts/smoke-test-mac.js
      # The tap (this repo) installs the published release and takes it off again
      - name: Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew tap xmui/jeditor "$GITHUB_WORKSPACE"
          brew install --cask xmui/jeditor/jeditor
          test -d /Applications/jEditor.app
          brew uninstall --cask --zap xmui/jeditor/jeditor
          test ! -d /Applications/jEditor.app
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-mac
          path: dist/jEditor-*-mac.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: mac
      # bsdtar, for the Arch package
      - run: sudo apt-get install -y libarchive-tools
      # The Mac app's tests run here too, as the Mac app and as the Linux one
      - name: App tests
        run: xvfb-run -a node test/mac.test.js
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: xvfb-run -a node scripts/smoke-test-mac.js
      # Installed as a user would (apt), run there, and taken off again
      - name: Install test
        run: |
          sudo apt-get install -y ./dist/jEditor-*-linux.deb
          test -x /opt/jEditor/jeditor
          test -f /usr/share/applications/jeditor.desktop
          xvfb-run -a node scripts/smoke-test-mac.js /opt/jEditor/jeditor
          sudo apt-get remove -y jeditor
          test ! -e /opt/jEditor/jeditor
      # The same on Arch Linux, in its own container: pacman installs the
      # package with its dependencies from Arch's repos, then removes it
      - name: Arch install test
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/w archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed xorg-server-xvfb nodejs
            pacman -U --noconfirm /w/dist/jEditor-*-linux.pacman
            test -x /opt/jEditor/jeditor
            test -f /usr/share/applications/jeditor.desktop
            cd /w && xvfb-run -a node scripts/smoke-test-mac.js /opt/jEditor/jeditor
            pacman -R --noconfirm jeditor
            test ! -e /opt/jEditor/jeditor'
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-linux
          path: |
            dist/jEditor-*-linux.AppImage
            dist/jEditor-*-linux.deb
            dist/jEditor-*-linux.pacman
