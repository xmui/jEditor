name: Build

# Every push and pull request: the UI and bridge tests (Linux), then on Windows the
# build, the smoke test (the real app opening a folder and saving a
# rotation), and an install / uninstall test; on a Mac, the Mac app's tests,
# its build and the same smoke test on the built app. The setup, the
# portable zip and the .dmg are kept as artifacts on the run's page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Install test
        shell: pwsh
        run: ./scripts/install-test.ps1 -Setup (Get-Item dist/jEditor-Setup-*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-Setup
          path: dist/jEditor-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-portable
          path: dist/jEditor-*-portable.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: mac
      - name: Mac app tests
        run: node test/mac.test.js
      - name: Build
        run: node build.js
        working-directory: mac
      - name: Smoke test
        run: node scripts/smoke-test-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: jEditor-mac
          path: dist/jEditor-*-mac.dmg
          if-no-files-found: error
